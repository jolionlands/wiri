name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep flags identical across check/test/build so Cargo can reuse artifacts.
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: Native build & test (${{ matrix.target }})
    needs: format
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Standard hosted ARM64 runners are available to public repositories.
          # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install native Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-${{ matrix.target }}

      - name: Verify native toolchain (not a cross-build or emulated tests)
        shell: pwsh
        env:
          EXPECTED_HOST: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ runner.arch }}
        run: |
          $hostLine = rustc -vV | Select-String '^host: '
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("$hostLine" -ne "host: $env:EXPECTED_HOST") { throw "Unexpected Rust host: $hostLine" }
          $wantedArch = if ($env:EXPECTED_HOST -like 'aarch64-*') { 'ARM64' } else { 'X64' }
          if ($env:EXPECTED_ARCH -ne $wantedArch) { throw "Expected a native $wantedArch runner, got $env:EXPECTED_ARCH" }

      - name: Cache cargo registry and target (per native job)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.target }}
          # PRs may restore main's cache, but must not replace it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check all targets (fail early on warnings)
        run: cargo check --release --all-targets -j 2 --locked

      - name: Test CI result validation (no desktop automation)
        shell: powershell
        run: ./scripts/ci/test-live-summary.ps1

      - name: Native tests
        run: cargo test --release -j 2 --locked

      - name: Build binaries
        run: cargo build --release -j 2 --locked

      - name: Share binaries with the live job (no second Cargo build)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: live-binaries-${{ matrix.target }}
          path: |
            target/release/wiri.exe
            target/release/wiri-ctl.exe
          if-no-files-found: error
          retention-days: 1

  live:
    name: Experimental live desktop (${{ matrix.target }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    # The full harness takes about 50 minutes on the tridaris desktop since lanes W/K/F2; hosted runners
    # are slower. At 30 minutes every live job was cancelled before writing a summary.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    env:
      WIRI_LIVE_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: live-binaries-${{ matrix.target }}
          path: target/release

      # Windows PowerShell 5.1/.NET Framework is required by the harness's WinForms Add-Type.
      # Probe first: an installed GUI stack is not a promise of an unlocked input desktop.
      - name: Probe desktop and run live harness when available
        shell: powershell
        run: ./scripts/ci/live-ci.ps1 -Bin target/release -Out .live

      - name: Upload live evidence even on failure or desktop skip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .live/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
